<!DOCTYPE html>

  body{margin:0;background:#FAFAF7;font-family:'Noto Sans JP',sans-serif;color:#2A2520;padding:16px}

  .row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E8E4DC;border-radius:10px;padding:10px 14px;margin-bottom:10px}
  .ico{width:28px;height:28px;border-radius:50%;background:#E8B84B;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ico svg{stroke:#fff;fill:none}
  .ico.txt{font-family:'Shippori Mincho',serif;color:#fff;font-weight:700;font-size:15px}
  .name{font-family:'Shippori Mincho',serif;font-weight:700;font-size:14px;letter-spacing:.03em}
